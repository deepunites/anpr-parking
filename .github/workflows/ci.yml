# CI (фаза 9 §5): lint → typecheck → unit → integration → security scan → build → container scan → push.
# Отдельные обязательные джобы: invariants (падение блокирует merge независимо от остальных), openapi-compat (oasdiff),
# migration-check (копия схемы staging + блокировки). Production-деплой — cd.yml, только с тега и после approval.
name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  packages: write
  security-events: write
env:
  REGISTRY: harbor.parking.uz/parking
  UV_VERSION: "0.12.17"

jobs:
  lint-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: backend
      - run: uv run mypy --strict src/
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run lint && npx tsc --noEmit && npm run check:api
        working-directory: frontend

  unit-integration:
    # реальные PostgreSQL 16 (contrib: btree_gist, pg_stat_statements, amcheck), Redis 7, MinIO — без sqlite/моков (A-47)
    runs-on: ubuntu-24.04
    needs: [lint-typecheck]
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_INITDB_ARGS: "--data-checksums"}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6390:6379"]
      minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        env: {MINIO_ROOT_USER: ci, MINIO_ROOT_PASSWORD: "${{ secrets.CI_MINIO_PASSWORD }}"}
        ports: ["9000:9000"]
        options: --health-cmd "curl -f http://localhost:9000/minio/health/live" --health-interval 5s --health-retries 20
    env:
      PARKING_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PARKING_TEST_REDIS_URL: redis://127.0.0.1:6390/1
      PARKING_S3_ENDPOINT: http://127.0.0.1:9000
      PARKING_S3_ACCESS_KEY: ci
      PARKING_S3_SECRET_KEY: ${{ secrets.CI_MINIO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
        working-directory: backend
      - name: Тесты + покрытие по слоям (пороги TESTING §1)
        run: |
          uv run pytest -q --cov --cov-report=json -p no:cacheprovider
          uv run python scripts/coverage_layers.py coverage.json
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npx vitest run
        working-directory: frontend

  invariants:
    # I-1…I-16 отдельной джобой: падение блокирует merge независимо от остальных (TESTING §3)
    runs-on: ubuntu-24.04
    needs: [lint-typecheck]
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6390:6379"]
    env:
      PARKING_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PARKING_TEST_REDIS_URL: redis://127.0.0.1:6390/1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --frozen && uv run pytest -q tests/invariants -p no:cacheprovider
        working-directory: backend

  openapi-compat:
    # несовместимое изменение v1 блокирует merge (oasdiff breaking); scripts/openapi_compat.py — второй барьер без Go
    runs-on: ubuntu-24.04
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v6
        with: {version: "${{ env.UV_VERSION }}"}
      - run: uv sync --frozen && uv run python scripts/export_openapi.py
        working-directory: backend
      - name: Базовая спецификация (main)
        run: git show origin/main:docs/openapi.json > /tmp/openapi-base.json || cp docs/openapi.json /tmp/openapi-base.json
      - uses: oasdiff/oasdiff-action/breaking@v0.0.21
        with: {base: /tmp/openapi-base.json, revision: docs/openapi.json, fail-on: ERR}
      - run: uv run python scripts/openapi_compat.py /tmp/openapi-base.json ../docs/openapi.json
        working-directory: backend

  migration-check:
    # каждая новая ревизия — отдельно на копии схемы staging: время и блокировки; ACCESS EXCLUSIVE на большой таблице → блок
    runs-on: ubuntu-24.04
    needs: [lint-typecheck]
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "${{ env.UV_VERSION }}"}
      - run: uv sync --frozen
        working-directory: backend
      - name: Копия схемы staging (ночной артефакт pg_dump --schema-only; без него — alembic до head-1)
        id: schema
        continue-on-error: true
        uses: actions/download-artifact@v4
        with: {name: staging-schema, path: /tmp/schema}
      - run: |
          extra=""
          [ -f /tmp/schema/schema.sql ] && extra="--schema-dump /tmp/schema/schema.sql"
          uv run python scripts/migration_check.py --dsn postgresql://postgres:postgres@127.0.0.1:5432/postgres --json migration-check.json $extra
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with: {name: migration-check, path: backend/migration-check.json}

  security-scan:
    runs-on: ubuntu-24.04
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}                      # gitleaks — вся история, не только HEAD
      - uses: astral-sh/setup-uv@v6
        with: {version: "${{ env.UV_VERSION }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: aquasecurity/setup-trivy@v0.2.3
      - uses: gitleaks/gitleaks-action@v2
        env: {GITLEAKS_CONFIG: security/gitleaks.toml}
      - run: uv sync --frozen
        working-directory: backend
      - name: bandit, pip-audit, npm audit, trivy fs, semgrep (исключения — security/exceptions.yaml с review_by)
        run: backend/.venv/bin/python scripts/security_scan.py --skip gitleaks

  build:
    runs-on: ubuntu-24.04
    needs: [unit-integration, invariants, openapi-compat, migration-check, security-scan]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Неизменяемый тег {semver}-{git-sha}; latest не публикуется
        run: |
          version=$(grep -m1 '^version' backend/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "tag=${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/parking-backend:${{ steps.meta.outputs.tag }}
          outputs: type=docker,dest=/tmp/backend.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          tags: ${{ env.REGISTRY }}/parking-frontend:${{ steps.meta.outputs.tag }}
          outputs: type=docker,dest=/tmp/frontend.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with: {name: images, path: /tmp/*.tar, retention-days: 3}

  container-scan:
    # образ проходит Trivy без CRITICAL/HIGH с фиксом и без секретов; неисправленные CVE базы — в security/exceptions.yaml
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: images, path: /tmp}
      - uses: aquasecurity/setup-trivy@v0.2.3
      - run: |
          for img in backend frontend; do
            trivy image --input /tmp/$img.tar --scanners vuln,secret --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table
            trivy image --input /tmp/$img.tar --scanners vuln,secret --format sarif -o trivy-$img.sarif
          done
      - uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: trivy-backend.sarif}

  push:
    runs-on: ubuntu-24.04
    needs: [build, container-scan]
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with: {name: images, path: /tmp}
      - uses: docker/login-action@v3
        with: {registry: harbor.parking.uz, username: "${{ secrets.HARBOR_USER }}", password: "${{ secrets.HARBOR_TOKEN }}"}
      - run: |
          for img in backend frontend; do
            docker load -i /tmp/$img.tar
            docker push ${{ env.REGISTRY }}/parking-$img:${{ needs.build.outputs.tag }}
          done
      - name: Подпись образов (cosign keyless) — Kyverno в кластере пускает только подписанные
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ${{ env.REGISTRY }}/parking-backend:${{ needs.build.outputs.tag }} ${{ env.REGISTRY }}/parking-frontend:${{ needs.build.outputs.tag }}

  helm-terraform:
    runs-on: ubuntu-24.04
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v3.19.0}
      - run: |
          helm lint deploy/helm/parking --strict --set image.tag=0.0.0-0000000
          helm lint deploy/helm/parking --strict -f deploy/helm/parking/values-staging.yaml --set image.tag=0.0.0-0000000
          helm template parking deploy/helm/parking --set image.tag=0.0.0-0000000 > /tmp/prod.yaml
          helm template parking deploy/helm/parking -f deploy/helm/parking/values-staging.yaml --set image.tag=0.0.0-0000000 > /tmp/staging.yaml
      - uses: yannh/kubeconform@v0.7.0
      - run: kubeconform -strict -ignore-missing-schemas -summary /tmp/prod.yaml /tmp/staging.yaml
      - uses: opentofu/setup-opentofu@v1
        with: {tofu_version: 1.10.6}
      - name: tofu fmt/validate/test (моки провайдеров, без облачных кредов)
        run: |
          cd deploy/terraform
          tofu fmt -check -recursive
          for env in envs/staging envs/production; do (cd $env && tofu init -backend=false -input=false && tofu validate); done
          (cd envs/staging && tofu test)
