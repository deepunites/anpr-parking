# Прод: SPA + прокси /api и /ws на API — один origin, refresh-cookie SameSite=Strict работает, CORS не нужен.
# Заголовки — те же, что в vite preview (securityHeaders в vite.config.ts): CSP без unsafe-inline/unsafe-eval.
# Камеры Hikvision/Dahua передают ключ последним сегментом пути: в журнал доступа — маска, а не ключ (как в API).
map $request_uri $masked_uri {
    "~^(?<head>/api/v1/camera/vendor/[a-z]+/)[^/?]+(?<tail>.*)$" $head***$tail;
    default $request_uri;
}
# события камер: не больше 16 одновременных соединений с адреса — 8-мегабайтные тела читаются до проверки ключа
limit_conn_zone $binary_remote_addr zone=camera_conn:1m;
log_format masked '$remote_addr - [$time_local] "$request_method $masked_uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 8080;
    access_log /dev/stdout masked;
    client_max_body_size 2m;  # кадр номера + XML камеры; как у ingress в Helm
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://media.example-parking.uz; connect-src 'self' wss: https://*.ingest.sentry.io; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;

    # source maps (build.sourcemap="hidden") загружаются в Sentry из CI и не раздаются пользователям
    location ~* \.map$ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # nginx — первый прокси: заголовок клиента не доверяем
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # события камер: камера (Hikvision без «Проверки ответа платформы») закрывает соединение, не дождавшись ответа —
    # событие всё равно доводится до API, а не обрывается на полпути
    location /api/v1/camera/ {
        client_max_body_size 9m;  # как BodyLimit API для vendor-событий (кадр + XML/JSON); Dahua шлёт и общий кадр
        limit_conn camera_conn 16;
        limit_conn_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # nginx — первый прокси: заголовок клиента не доверяем
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ignore_client_abort on;
        proxy_read_timeout 30s;
        error_log /dev/stderr crit;  # ошибки upstream пишут строку запроса с ключом камеры; причина видна в журнале API
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # nginx — первый прокси: заголовок клиента не доверяем
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
