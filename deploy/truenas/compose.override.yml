# Сервер TrueNAS на площадке: тот же набор сервисов, что у локального стенда (deploy/local/compose.yml), но
# профиль site — одна компания, администратор, площадка и камера въезда, без демо-клиентов и без открытой регистрации.
# Запускается скриптом deploy/truenas/install.sh; значения — из deploy/truenas/parking.env.
services:
  relay-sim:
    profiles: ["demo"]  # имитатор Modbus-реле нужен только демо-стенду

  init:
    environment:
      STAND_PROFILE: site
      STAND_COMPANY: ${PARKING_COMPANY:-MediaPark}
      STAND_LOT_NAME: ${PARKING_LOT_NAME:-MediaPark}
      STAND_LOT_CAPACITY: ${PARKING_LOT_CAPACITY:-54}
      STAND_LOT_CIDRS: ${PARKING_LOT_CIDRS:-192.168.13.0/24}
      STAND_ADMIN_LOGIN: ${PARKING_ADMIN_LOGIN:-admin@mediapark.uz}
      STAND_TIMEZONE: ${PARKING_TIMEZONE:-Asia/Tashkent}
      STAND_DEMO_WEEK: "0"
    depends_on:
      relay-sim:
        condition: service_started
        required: false  # в профиле site имитатора нет

  # Круглосуточная запись камер на диск сервера: включает deploy/truenas/video.sh (профиль video). Пути — от
  # deploy/local (каталог первого compose-файла). Папка видео не создаётся сама: без пула запись не начнётся,
  # а не заполнит системный диск.
  video:
    profiles: ["video"]
    image: anpr-parking/video:local
    build:
      context: ../truenas/video
    init: true
    restart: unless-stopped
    environment:
      TZ: ${PARKING_TIMEZONE:-Asia/Tashkent}
      VIDEO_KEEP_DAYS: ${PARKING_VIDEO_KEEP_DAYS:-30}
      VIDEO_MAX_USE_PERCENT: ${PARKING_VIDEO_MAX_USE_PERCENT:-90}
    volumes:
      - type: bind
        source: ${PARKING_VIDEO_DIR:-/mnt/records}
        target: /video
        bind:
          create_host_path: false
      - type: bind
        source: ../truenas/video-streams.conf
        target: /config/streams.conf
        read_only: true
        bind:
          create_host_path: false
    logging:
      options:
        max-size: 10m
        max-file: "3"
