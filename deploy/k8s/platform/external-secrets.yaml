# External Secrets Operator → Vault (Kubernetes auth). Секретов kind: Secret в git нет; ESO создаёт их из kv/parking/<env>/app.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: https://vault.infra.parking.uz:8200
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: parking-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: parking-eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
