apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@parking.example.uz
    privateKeySecretRef: {name: letsencrypt-dns-account}
    solvers:
      - dns01:
          rfc2136:
            nameserver: 10.10.0.53:53
            tsigKeyName: tsig-certmanager.
            tsigAlgorithm: HMACSHA256
            tsigSecretSecretRef: {name: tsig-certmanager, key: secret}   # из Vault через ExternalSecret
