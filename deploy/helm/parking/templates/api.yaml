apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parking.fullname" . }}-api
  labels:
    {{- include "parking.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate            # readiness gate: новый под получает трафик только после /health/ready
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "parking.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
    spec:
      serviceAccountName: {{ include "parking.fullname" . }}-api
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "parking.podSecurityContext" . | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "parking.affinity" (dict "root" . "component" "api") | nindent 8 }}
      containers:
        - name: api
          image: {{ include "parking.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn"]
          args:
            - parking.api.main:app
            - --host=0.0.0.0
            - --port={{ .Values.api.service.port }}
            - --workers={{ .Values.api.workers }}
            - --timeout-keep-alive={{ .Values.api.keepAliveSeconds }}
            - --timeout-graceful-shutdown={{ sub .Values.api.terminationGracePeriodSeconds 5 }}
            - --no-server-header
            - --proxy-headers
            - --forwarded-allow-ips=*
          env:
            {{- include "parking.backendEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "parking.secretName" . }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          securityContext:
            {{- include "parking.containerSecurityContext" . | nindent 12 }}
          # liveness — только процесс; readiness — Redis обязателен, PostgreSQL как degraded (A-60)
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              # дать ingress/kube-proxy убрать endpoint до SIGTERM (иначе первые запросы после SIGTERM получают reset)
              exec: {command: ["sh", "-c", "sleep 5"]}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "parking.caVolumeMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        {{- include "parking.caVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parking.fullname" . }}-api
  labels:
    {{- include "parking.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "parking.fullname" . }}-api
  labels:
    {{- include "parking.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "parking.fullname" . }}-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Pods, value: 1, periodSeconds: 120}]
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{type: Pods, value: 2, periodSeconds: 60}]
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.api.hpa.cpuUtilization }}}
    - type: Pods                    # RPS через prometheus-adapter (deploy/k8s/platform/prometheus-adapter-values.yaml)
      pods:
        metric: {name: parking_http_requests_per_second}
        target: {type: AverageValue, averageValue: {{ .Values.api.hpa.requestsPerSecondPerPod | quote }}}
{{- end }}
