apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parking.fullname" . }}-frontend
  labels:
    {{- include "parking.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "parking.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: {{ include "parking.fullname" . }}-frontend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.frontend.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101            # nginx-unprivileged
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "parking.affinity" (dict "root" . "component" "frontend") | nindent 8 }}
      containers:
        - name: nginx
          image: {{ include "parking.frontendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
          securityContext:
            {{- include "parking.containerSecurityContext" . | nindent 12 }}
          livenessProbe:
            httpGet: {path: /index.html, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /index.html, port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: cache
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parking.fullname" . }}-frontend
  labels:
    {{- include "parking.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "parking.fullname" . }}
  labels:
    {{- include "parking.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.domain | quote }}]
      secretName: {{ include "parking.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          # один origin для SPA и API: refresh-cookie SameSite=Strict, CORS не нужен (FRONTEND §4)
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "parking.fullname" . }}-api
                port: {name: http}
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: {{ include "parking.fullname" . }}-api
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "parking.fullname" . }}-frontend
                port: {name: http}
{{- end }}
