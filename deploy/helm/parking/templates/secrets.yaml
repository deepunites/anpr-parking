{{- if .Values.secrets.external.enabled }}
# Секреты приложения приходят из Vault через External Secrets Operator; kind: Secret в git нет (§2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "parking.secretName" . }}
  labels:
    {{- include "parking.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.external.storeRef.name }}
    kind: {{ .Values.secrets.external.storeRef.kind }}
  target:
    name: {{ include "parking.secretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: {{ .Values.secrets.external.path }}
{{- else if .Values.secrets.inline.enabled }}
# Только sandbox/dev: значения передаются через --set-file / --values вне git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "parking.secretName" . }}
  labels:
    {{- include "parking.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.inline.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- else }}
{{- fail "secrets.external.enabled or secrets.inline.enabled must be true" }}
{{- end }}
