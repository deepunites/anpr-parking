{{- $root := . -}}
{{- $names := list "api" "publisher" "consumer" "replayer" "camera-health" "webhooks" "frontend" "celery-beat" "migrate" -}}
{{- range $name, $pool := .Values.celery.pools }}
{{- $names = append $names (printf "celery-%s" $name) }}
{{- end }}
{{- range $name := $names }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "parking.fullname" $root }}-{{ $name }}
  labels:
    {{- include "parking.labels" $root | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
